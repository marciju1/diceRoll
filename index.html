<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Dice Roller</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1f1f1f;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #2c2c2c;
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      width: min(92vw, 520px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .die {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #cfcfcf;
    }

    .formula {
      font-size: 1rem;
      margin-bottom: 0.4rem;
      color: #b0b0b0;
    }

    .mode {
      font-size: 0.95rem;
      margin-bottom: 1rem;
      color: #9fd0ff;
      min-height: 1.2em;
    }

    .result {
      font-size: 4rem;
      font-weight: bold;
      margin: 0.5rem 0;
    }

    .breakdown {
      font-size: 1rem;
      color: #d8d8d8;
      min-height: 1.5em;
      margin-bottom: 1.5rem;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    button {
      font-size: 1rem;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 10px;
      background: #4c8bf5;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #3a76db;
    }

    .secondary {
      background: #555;
    }

    .secondary:hover {
      background: #666;
    }

    .special {
      background: #7a4cf5;
    }

    .special:hover {
      background: #6538d9;
    }

    .hidden {
      display: none;
    }

    .history {
      text-align: left;
      font-size: 0.9rem;
      color: #c8c8c8;
      border-top: 1px solid #444;
      padding-top: 1rem;
      margin-top: 0.5rem;
      max-height: 9rem;
      overflow-y: auto;
    }

    .history-title {
      font-weight: bold;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-item {
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>NFC Dice Roller</h1>
    <div class="die" id="dieLabel">Loading...</div>
    <div class="formula" id="formulaLabel">-</div>
    <div class="mode" id="modeLabel"></div>
    <div class="result" id="result">-</div>
    <div class="breakdown" id="breakdown">-</div>

    <div class="buttons">
      <button id="rerollBtn">Reroll</button>
      <button id="addDieBtn">+1 Die</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <button id="advBtn" class="special hidden">Advantage</button>
      <button id="disBtn" class="special hidden">Disadvantage</button>
    </div>

    <div class="history" id="history">
      <div class="history-title">Last rolls</div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    const allowedDice = {
      d4: 4,
      d6: 6,
      d8: 8,
      d10: 10,
      d12: 12,
      d20: 20,
      d100: 100
    };

    const params = new URLSearchParams(window.location.search);
    const dieParam = params.get("die");

    const dieLabel = document.getElementById("dieLabel");
    const formulaLabel = document.getElementById("formulaLabel");
    const modeLabel = document.getElementById("modeLabel");
    const resultEl = document.getElementById("result");
    const breakdownEl = document.getElementById("breakdown");

    const rerollBtn = document.getElementById("rerollBtn");
    const addDieBtn = document.getElementById("addDieBtn");
    const resetBtn = document.getElementById("resetBtn");
    const advBtn = document.getElementById("advBtn");
    const disBtn = document.getElementById("disBtn");

    const historyList = document.getElementById("historyList");

    let currentDie = allowedDice[dieParam] ? dieParam : "d20";
    let diceCount = 1;
    let history = [];

    function rollDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function rollMultipleDice(sides, count) {
      const rolls = [];
      for (let i = 0; i < count; i++) {
        rolls.push(rollDie(sides));
      }
      return rolls;
    }

    function updateD20Buttons() {
      const isD20 = currentDie === "d20";
      advBtn.classList.toggle("hidden", !isD20);
      disBtn.classList.toggle("hidden", !isD20);
    }

    function addToHistory(entry) {
      history.unshift(entry);
      if (history.length > 5) {
        history = history.slice(0, 5);
      }

      historyList.innerHTML = "";
      history.forEach(item => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.textContent = `${item.formula} → ${item.total} (${item.breakdown})`;
        historyList.appendChild(li);
      });
    }

    function doRoll() {
      const sides = allowedDice[currentDie];
      const rolls = rollMultipleDice(sides, diceCount);
      const total = rolls.reduce((sum, value) => sum + value, 0);

      const formulaText = `${diceCount}${currentDie}`;

      dieLabel.textContent = `Active die: ${currentDie}`;
      formulaLabel.textContent = `Formula: ${formulaText}`;
      modeLabel.textContent = "Mode: Normal";
      resultEl.textContent = total;
      breakdownEl.textContent = `Breakdown: ${rolls.join(" + ")}`;

      updateD20Buttons();

      addToHistory({
        formula: `${formulaText} (Normal)`,
        total,
        breakdown: rolls.join(" + ")
      });
    }

    function doAdvantageRoll() {
      if (currentDie !== "d20") return;

      const first = rollDie(20);
      const second = rollDie(20);
      const result = Math.max(first, second);

      const formulaText = "1d20 adv";

      dieLabel.textContent = `Active die: ${currentDie}`;
      formulaLabel.textContent = "Formula: 1d20";
      modeLabel.textContent = "Mode: Advantage";
      resultEl.textContent = result;
      breakdownEl.textContent = `Breakdown: ${first}, ${second}`;

      updateD20Buttons();

      addToHistory({
        formula: formulaText,
        total: result,
        breakdown: `${first}, ${second}`
      });
    }

    function doDisadvantageRoll() {
      if (currentDie !== "d20") return;

      const first = rollDie(20);
      const second = rollDie(20);
      const result = Math.min(first, second);

      const formulaText = "1d20 dis";

      dieLabel.textContent = `Active die: ${currentDie}`;
      formulaLabel.textContent = "Formula: 1d20";
      modeLabel.textContent = "Mode: Disadvantage";
      resultEl.textContent = result;
      breakdownEl.textContent = `Breakdown: ${first}, ${second}`;

      updateD20Buttons();

      addToHistory({
        formula: formulaText,
        total: result,
        breakdown: `${first}, ${second}`
      });
    }

    rerollBtn.addEventListener("click", doRoll);

    addDieBtn.addEventListener("click", () => {
      diceCount += 1;
      doRoll();
    });

    resetBtn.addEventListener("click", () => {
      diceCount = 1;
      doRoll();
    });

    advBtn.addEventListener("click", doAdvantageRoll);
    disBtn.addEventListener("click", doDisadvantageRoll);

    doRoll();
  </script>
</body>
</html>
