<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Dice Roller</title>
  <style>
    :root {
      --bg: #14110f;
      --bg-2: #1d1814;
      --panel: #241d18;
      --panel-2: #2d241e;
      --line: #4b3a2f;
      --text: #f3e9dc;
      --muted: #c9b79f;
      --gold: #c79a52;
      --gold-dark: #9a7237;
      --blue: #6ea8d9;
      --purple: #8f73d6;
      --danger: #8f4b4b;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #2e241d 0%, var(--bg) 45%, #0f0c0a 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .app {
      width: min(100%, 560px);
      background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 50px var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 1.4rem 1.4rem 1rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(199,154,82,0.08), rgba(0,0,0,0));
      text-align: center;
    }

    .title {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .subtitle {
      margin-top: 0.35rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .main {
      padding: 1.2rem;
      display: grid;
      gap: 1rem;
    }

    .result-card {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.1rem;
      text-align: center;
    }

    .die {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .formula {
      font-size: 1rem;
      color: var(--gold);
      margin-bottom: 0.35rem;
    }

    .mode {
      min-height: 1.2em;
      font-size: 0.95rem;
      color: var(--blue);
      margin-bottom: 0.8rem;
    }

    .result {
      font-size: clamp(3rem, 8vw, 4.8rem);
      line-height: 1;
      font-weight: bold;
      color: #fff7ea;
      text-shadow: 0 0 12px rgba(199,154,82,0.15);
      margin-bottom: 0.7rem;
    }

    .breakdown {
      font-size: 1rem;
      color: var(--text);
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 0.8rem;
      min-height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .controls {
      display: grid;
      gap: 0.8rem;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    button {
      min-height: 48px;
      padding: 0.9rem 1rem;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease, background 0.2s ease;
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }

    .primary {
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      color: #1c140d;
    }

    .primary:hover {
      opacity: 0.95;
    }

    .secondary {
      background: #5d4a3b;
    }

    .secondary:hover {
      background: #6a5544;
    }

    .special {
      background: linear-gradient(180deg, #8b78d8, #6e59be);
    }

    .special:hover {
      opacity: 0.95;
    }

    .danger {
      background: #6e4040;
    }

    .danger:hover {
      background: #815050;
    }

    .hidden {
      display: none;
    }

    .history {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
    }

    .history-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 0.8rem;
      letter-spacing: 0.03em;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.55rem;
    }

    .history-item {
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 0.75rem 0.8rem;
      line-height: 1.35;
      color: var(--text);
      font-size: 0.95rem;
    }

    @media (max-width: 520px) {
      .main {
        padding: 1rem;
      }

      .header {
        padding: 1.2rem 1rem 0.9rem;
      }

      .title {
        font-size: 1.4rem;
      }

      .button-row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 class="title">NFC Dice Roller</h1>
      <div class="subtitle">Tap a die token, then roll your fate.</div>
    </div>

    <div class="main">
      <div class="result-card">
        <div class="die" id="dieLabel">Loading...</div>
        <div class="formula" id="formulaLabel">-</div>
        <div class="mode" id="modeLabel"></div>
        <div class="result" id="result">-</div>
        <div class="breakdown" id="breakdown">-</div>
      </div>

      <div class="controls">
        <div class="button-row">
          <button id="rerollBtn" class="primary">Reroll</button>
          <button id="addDieBtn" class="secondary">+1 Die</button>
        </div>

        <div class="button-row">
          <button id="resetBtn" class="secondary">Reset</button>
          <button id="clearHistoryBtn" class="danger">Clear History</button>
        </div>

        <div class="button-row" id="d20Row">
          <button id="advBtn" class="special hidden">Advantage</button>
          <button id="disBtn" class="special hidden">Disadvantage</button>
        </div>
      </div>

      <div class="history">
        <div class="history-title">Last Rolls</div>
        <ul class="history-list" id="historyList"></ul>
      </div>
    </div>
  </div>

  <script>
    const allowedDice = {
      d4: 4,
      d6: 6,
      d8: 8,
      d10: 10,
      d12: 12,
      d20: 20,
      d100: 100
    };

    const params = new URLSearchParams(window.location.search);
    const dieParam = params.get("die");

    const dieLabel = document.getElementById("dieLabel");
    const formulaLabel = document.getElementById("formulaLabel");
    const modeLabel = document.getElementById("modeLabel");
    const resultEl = document.getElementById("result");
    const breakdownEl = document.getElementById("breakdown");

    const rerollBtn = document.getElementById("rerollBtn");
    const addDieBtn = document.getElementById("addDieBtn");
    const resetBtn = document.getElementById("resetBtn");
    const advBtn = document.getElementById("advBtn");
    const disBtn = document.getElementById("disBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");

    const historyList = document.getElementById("historyList");

    let currentDie = allowedDice[dieParam] ? dieParam : "d20";
    let diceCount = 1;
    let history = JSON.parse(localStorage.getItem("diceRollHistory")) || [];

    function rollDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function rollMultipleDice(sides, count) {
      const rolls = [];
      for (let i = 0; i < count; i++) {
        rolls.push(rollDie(sides));
      }
      return rolls;
    }

    function updateD20Buttons() {
      const isD20 = currentDie === "d20";
      advBtn.classList.toggle("hidden", !isD20);
      disBtn.classList.toggle("hidden", !isD20);
    }

    function renderHistory() {
      historyList.innerHTML = "";

      if (history.length === 0) {
        const li = document.createElement("li");
        li.className = "history-item";
        li.textContent = "No rolls yet.";
        historyList.appendChild(li);
        return;
      }

      history.forEach(item => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.textContent = `${item.formula} → ${item.total} (${item.breakdown})`;
        historyList.appendChild(li);
      });
    }

    function saveHistory() {
      localStorage.setItem("diceRollHistory", JSON.stringify(history));
    }

    function addToHistory(entry) {
      history.unshift(entry);

      if (history.length > 5) {
        history = history.slice(0, 5);
      }

      saveHistory();
      renderHistory();
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem("diceRollHistory");
      renderHistory();
    }

    function flashResult() {
      resultEl.animate(
        [
          { transform: "scale(0.92)", opacity: 0.6 },
          { transform: "scale(1.05)", opacity: 1 },
          { transform: "scale(1)", opacity: 1 }
        ],
        {
          duration: 220,
          easing: "ease-out"
        }
      );
    }

    function doRoll() {
      const sides = allowedDice[currentDie];
      const rolls = rollMultipleDice(sides, diceCount);
      const total = rolls.reduce((sum, value) => sum + value, 0);

      const formulaText = `${diceCount}${currentDie}`;

      dieLabel.textContent = `Active die: ${currentDie}`;
      formulaLabel.textContent = `Formula: ${formulaText}`;
      modeLabel.textContent = "Mode: Normal";
      resultEl.textContent = total;
      breakdownEl.textContent = `Breakdown: ${rolls.join(" + ")}`;

      updateD20Buttons();
      flashResult();

      addToHistory({
        formula: `${formulaText} (Normal)`,
        total,
        breakdown: rolls.join(" + ")
      });
    }

    function doAdvantageRoll() {
      if (currentDie !== "d20") return;

      const first = rollDie(20);
      const second = rollDie(20);
      const result = Math.max(first, second);

      dieLabel.textContent = `Active die: ${currentDie}`;
      formulaLabel.textContent = "Formula: 1d20";
      modeLabel.textContent = "Mode: Advantage";
      resultEl.textContent = result;
      breakdownEl.textContent = `Breakdown: ${first}, ${second}`;

      updateD20Buttons();
      flashResult();

      addToHistory({
        formula: "1d20 adv",
        total: result,
        breakdown: `${first}, ${second}`
      });
    }

    function doDisadvantageRoll() {
      if (currentDie !== "d20") return;

      const first = rollDie(20);
      const second = rollDie(20);
      const result = Math.min(first, second);

      dieLabel.textContent = `Active die: ${currentDie}`;
      formulaLabel.textContent = "Formula: 1d20";
      modeLabel.textContent = "Mode: Disadvantage";
      resultEl.textContent = result;
      breakdownEl.textContent = `Breakdown: ${first}, ${second}`;

      updateD20Buttons();
      flashResult();

      addToHistory({
        formula: "1d20 dis",
        total: result,
        breakdown: `${first}, ${second}`
      });
    }

    rerollBtn.addEventListener("click", doRoll);

    addDieBtn.addEventListener("click", () => {
      diceCount += 1;
      doRoll();
    });

    resetBtn.addEventListener("click", () => {
      diceCount = 1;
      doRoll();
    });

    advBtn.addEventListener("click", doAdvantageRoll);
    disBtn.addEventListener("click", doDisadvantageRoll);
    clearHistoryBtn.addEventListener("click", clearHistory);

    updateD20Buttons();
    renderHistory();
    doRoll();
  </script>
</body>
</html>
